version: "3.9"
services:
  web:
    build: .
    command: /bin/sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:${PORT:-8000}"
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-True}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-insecure-dev-secret}"
      PORT: "${PORT:-8000}"
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - .:/app
