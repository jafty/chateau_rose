{% load static %}
<article class="provider-service-card">
    <span class="tape" aria-hidden="true"></span>
    <div class="provider-service-card__media">
        {% if card.resolved_image %}
            <img src="{{ card.resolved_image }}" alt="{{ card.name }}" loading="lazy" decoding="async">
        {% else %}
            <img src="{% static 'demo_pictures/provider-placeholder.svg' %}" alt="{{ card.name }}" loading="lazy" decoding="async">
        {% endif %}
    </div>
    <div class="provider-service-card__content">
        <div class="provider-service-card__top">
            <h4>{{ card.name }}</h4>
            {% if card.price_display %}<span class="service-price">Dès <span class="price-value">{{ card.price_display }}</span></span>{% endif %}
        </div>
        {% if card_url %}
            <a class="btn btn-accent provider-service-card__button" href="{{ card_url }}">{{ card_cta|default:"Réserver rapidement" }}</a>
        {% else %}
            <button type="button" class="btn btn-accent provider-service-card__button" data-service-card="{{ card.id }}">{{ card_cta|default:"Estimer et réserver" }}</button>
        {% endif %}
    </div>
</article>
