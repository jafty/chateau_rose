{% extends "admin/change_form.html" %}
{% block after_field_sets %}
{{ block.super }}
{% if original and original.status == "WAITING_PROVIDER_ASSIGNMENT" %}
<fieldset class="module aligned">
    <h2>Assigner une prestataire</h2>
    <form method="post" action="{% url 'admin:booking_booking_assign_provider' original.pk %}">
        {% csrf_token %}
        <div class="form-row">
            <label for="assign-service-id">Service prestataire compatible :</label>
            <select id="assign-service-id" name="service_id" required>
                <option value="">---------</option>
                {% for service in assign_provider_services %}
                    <option value="{{ service.id }}">{{ service.provider.name }} · {{ service.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="submit-row"><input type="submit" class="default" value="Assigner via le use case"></div>
    </form>
</fieldset>
{% endif %}
{% endblock %}
